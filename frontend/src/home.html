<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="home.css">
    <title>Fitness Booking</title>
</head>
<body>
<header class="navbar">
    <div class="logo">
        Hello
    </div>

    <div class="nav-buttons">
        <a href="#" class="login-btn">Find Session</a>
        <a href="#" class="login-btn">Home</a>
        <a href="login.html" class="signup-btn">Logout</a>
    </div>

</header>

<main>
    <section class="hero">
        <div class="hero-content">
            <div class="book_session">
                <img src="aura-farmers.png" alt="Person training in the gym">

                <div class="book_session_text">
                    <p>Featured Workout</p>
                    <h2>Book Session</h2>
                </div>
            </div>

            <div class="booked_session">
                <img src="calendar.png" alt="Person training in the gym">

                <div class="booked_session_text">
                    <p>Appointments</p>
                    <h2>Booked Session</h2>
                </div>
            </div>

            <div class="cancel_session">
                <img src="cancel.png" alt="Person training in the gym">

                <div class="cancel_session_text">
                    <p>Not participating</p>
                    <h2>Cancel Session</h2>
                </div>
            </div>
        </div>

    </section>

</main>

<footer>
    <p>FitnessBookingSystem.</p>
</footer>
</body>
</html>
