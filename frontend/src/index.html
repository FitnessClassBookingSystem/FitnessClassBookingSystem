<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Fitness Booking</title>
</head>
<body>
<header class="navbar">
    <div class="logo">
        FitnessBooking
    </div>

    <div class="nav-buttons">
        <a href="login.html" class="login-btn">Login</a>
        <a href="#" class="signup-btn">Sign Up</a>
    </div>

</header>

<main>
    <section class="hero">
        <div class="hero-content">
            <p class="text">FITNESS | STRENGTH | DISCIPLINE</p>
            <h1>
                It's a GYM,
                <span>not a spa.</span>
            </h1>

            <p class="hero_description">
                We will Brake you so we can Make you, when you get out there
                nothing can Phase you.
            </p>

            <div class="hero_buttons">
                <form id="signup-form">
                    <input type="text" id="username" placeholder="Username" required>
                    <input type="email" id="email" placeholder="Email" required>
                    <input type="password" id="password" placeholder="Password" required>

                    <button type="submit" class="primary_btn">
                        Sign Up
                    </button>
                </form>
            </div>
        </div>

        <div class="hero_image">
            <img src="black.png" alt="Person training in the gym">
        </div>
    </section>

</main>

<footer>
    <p>FitnessBookingSystem.</p>
</footer>
</body>
</html>
